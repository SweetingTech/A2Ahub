services:
  a2ahub:
    build: .
    image: a2ahub:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${A2AHUB_PORT:-4317}:4317"
    environment:
      A2AHUB_DOCKER: "1"
      A2AHUB_DATA_DIR: /data
      PORT: 4317
    env_file:
      - path: .env
        required: false
    volumes:
      - a2ahub-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  a2ahub-data:
